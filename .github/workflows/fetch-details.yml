name: Refresh app cards

# Re-reads rating, version and size and regenerates data/apps.json. Pushing the
# result triggers the Vercel builds.
#
# The catalog holds far more packages than one job can refresh in a sitting
# (each package costs one request per language), so this runs nightly and works
# through the backlog in chunks: --stale-days skips cards refreshed recently,
# --limit caps a single run. Every card ends up refreshed within STALE_DAYS.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum packages this run (blank = workflow default)'
        required: false
      stale_days:
        description: 'Skip cards refreshed within this many days (0 = refresh everything)'
        required: false
      llm:
        description: 'Use Claude for summaries (needs ANTHROPIC_API_KEY)'
        type: boolean
        required: false
        default: false

env:
  # ~600 packages x 3 languages at ~1.5s is roughly 45 minutes per run.
  CHUNK_LIMIT: '600'
  STALE_DAYS: '10'

permissions:
  contents: write

concurrency:
  group: catalog-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch card details
        env:
          REQUEST_DELAY_MS: '1500'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/fetch-details.js \
            --limit "${{ inputs.limit || env.CHUNK_LIMIT }}" \
            --stale-days "${{ inputs.stale_days || env.STALE_DAYS }}" \
            ${{ inputs.llm && '--llm' || '' }}

      - name: Validate the dataset
        run: npm run data:validate

      - name: Verify all three language builds
        run: npm run build:all

      - name: Commit the refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- data/apps.json data/apps.meta.json data/package-ids.json; then
            echo 'No data change'
            exit 0
          fi
          count=$(node -p "require('./data/apps.json').length")
          git add data/apps.json data/apps.meta.json data/package-ids.json
          git commit -m "chore(data): refresh ${count} app cards"
          git push
