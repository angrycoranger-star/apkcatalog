name: Import GitHub-release apps

# Weekly: refresh open-source apps that ship an APK in their GitHub releases.
# Sources are the hand-picked config/github-apps.js plus everything discovered
# from the OpenAPK list (scripts/openapk-import.js). Each app is one API call
# plus one APK download, so the number actually imported is bounded by --limit.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max apps to import (blank = 1000)'
        required: false

permissions:
  contents: write

concurrency:
  group: catalog-data
  cancel-in-progress: false

jobs:
  github-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Discover repos from OpenAPK
        run: node scripts/openapk-import.js

      - name: Import GitHub-release apps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/github-import.js \
            --limit ${{ inputs.limit || '1000' }}

      - name: Validate the dataset
        run: npm run data:validate

      - name: Verify all four language builds
        run: npm run build:all

      - name: Commit the GitHub-release catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/github-apps.json data/github.meta.json data/openapk-repos.json data/openapk.meta.json public/img/github 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No GitHub-release change'
            exit 0
          fi
          count=$(node -p "require('./data/github-apps.json').length")
          git commit -m "chore(data): refresh ${count} GitHub-release apps"
          # A long collector run can finish after main has moved (unrelated
          # pushes race us). Rebase the data commit onto the latest main and
          # retry — the data files never conflict with source changes.
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then pushed=true; break; fi
            echo "push rejected, rebasing onto origin/main (attempt ${attempt}/5)"
            git fetch origin main
            git rebase origin/main || { echo 'rebase conflict'; git rebase --abort; exit 1; }
            sleep $((RANDOM % 4 + 1))
          done
          [ "$pushed" = true ] || { echo 'push failed after retries'; exit 1; }
