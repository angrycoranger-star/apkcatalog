name: Import F-Droid apps

# Weekly: refresh the open-source (F-Droid) catalog. F-Droid publishes the whole
# repository in one index, so this is a single request — no rate-limiting.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo base URL(s), comma-separated. Blank = F-Droid + IzzyOnDroid.'
        required: false
        default: ''
      limit:
        description: 'Max apps to import (blank = all)'
        required: false

permissions:
  contents: write

concurrency:
  group: catalog-data
  cancel-in-progress: false

jobs:
  fdroid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Import F-Droid + IzzyOnDroid
        run: |
          node scripts/fdroid-import.js \
            ${{ inputs.repo && format('--repo {0}', inputs.repo) || '' }} \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      - name: Validate the dataset
        run: npm run data:validate

      - name: Verify all four language builds
        run: npm run build:all

      - name: Commit the F-Droid catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- data/fdroid-apps.json data/fdroid.meta.json; then
            echo 'No F-Droid change'
            exit 0
          fi
          count=$(node -p "require('./data/fdroid-apps.json').length")
          git add data/fdroid-apps.json data/fdroid.meta.json
          git commit -m "chore(data): refresh ${count} F-Droid apps"
          # A long collector run can finish after main has moved (unrelated
          # pushes race us). Rebase the data commit onto the latest main and
          # retry — the data files never conflict with source changes.
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then pushed=true; break; fi
            echo "push rejected, rebasing onto origin/main (attempt ${attempt}/5)"
            git fetch origin main
            git rebase origin/main || { echo 'rebase conflict'; git rebase --abort; exit 1; }
            sleep $((RANDOM % 4 + 1))
          done
          [ "$pushed" = true ] || { echo 'push failed after retries'; exit 1; }
