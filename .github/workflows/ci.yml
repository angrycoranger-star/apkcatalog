name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate dataset
        run: npm run data:validate

      - name: Collector pipeline smoke test (offline)
        run: npm run smoke

      - name: Build every language
        run: npm run build:all
